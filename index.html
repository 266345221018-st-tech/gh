<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PixelForge | Home</title>
</head>
<body class="bg-slate-50 font-sans">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-xl">P</span>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-800 uppercase">PixelForge</span>
                </div>
                <div class="hidden md:flex space-x-6 text-slate-600 font-medium">
                    <a href="index.html" class="text-indigo-600">หน้าแรก</a>
                    <a href="gallery.html" class="hover:text-indigo-600 transition">แกลเลอรี</a>
                    <a href="about.html" class="hover:text-indigo-600 transition">เกี่ยวกับเรา</a>
                    <a href="contact.html" class="hover:text-indigo-600 transition">ติดต่อ</a>
                </div>
                <button id="menuBtn" class="md:hidden p-2 text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
            </div>
        </div>
        <div id="mobileMenu" class="hidden md:hidden bg-white border-t p-4 space-y-3">
            <a href="index.html" class="block text-indigo-600 font-bold">หน้าแรก</a>
            <a href="gallery.html" class="block text-slate-600">แกลเลอรี</a>
            <a href="about.html" class="block text-slate-600">เกี่ยวกับเรา</a>
            <a href="contact.html" class="block text-slate-600">ติดต่อ</a>
        </div>
    </nav>

    <header class="min-h-[60vh] flex items-center justify-center bg-indigo-900 text-white px-4 relative overflow-hidden">
        <div class="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa')] bg-cover"></div>
        <div class="relative text-center max-w-2xl">
            <h1 class="text-4xl md:text-6xl font-extrabold mb-6">คลังภาพถ่ายดิจิทัลระดับพรีเมียม</h1>
            <p class="text-lg md:text-xl mb-8 text-indigo-100">ยกระดับโปรเจกต์ของคุณด้วยงานภาพจากช่างภาพมืออาชีพทั่วโลก</p>
            <a href="gallery.html" class="bg-indigo-500 hover:bg-indigo-600 text-white px-8 py-3 rounded-full font-bold transition inline-block">เลือกดูภาพถ่าย</a>
        </div>
    </header>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
    </script>
</body>
</html>
