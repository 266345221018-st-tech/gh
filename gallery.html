<main class="max-w-7xl mx-auto py-10 px-4">
    <h2 class="text-3xl font-bold mb-8">รูปภาพทั้งหมด</h2>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        
        <div class="bg-white rounded-lg shadow-sm overflow-hidden border border-gray-100 hover:shadow-lg transition">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" class="w-full h-48 object-cover">
            <div class="p-4">
                <h3 class="font-bold text-lg text-gray-800">Misty Mountains</h3>
                <p class="text-sm text-gray-500 mb-4">โดย: Somsak Photo</p>
                <div class="flex justify-between items-center">
                    <span class="text-indigo-600 font-bold">฿290</span>
                    <button onclick="openModal('Misty Mountains', 290)" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm hover:bg-indigo-700">ดูข้อมูล/สั่งซื้อ</button>
                </div>
            </div>
        </div>
        </div>
</main>

<div id="orderModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 animate-scale-in">
        <div class="flex justify-between items-center mb-4">
            <h3 id="modalTitle" class="text-xl font-bold">ยืนยันการสั่งซื้อ</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-black text-2xl">&times;</button>
        </div>
        <p class="text-gray-600 mb-6">คุณกำลังจะสั่งซื้อภาพ <span id="photoName" class="font-bold"></span> ในราคา <span id="photoPrice" class="text-indigo-600 font-bold"></span> บาท</p>
        <button onclick="alert('สั่งซื้อสำเร็จ!')" class="w-full bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600 transition">ยืนยันการชำระเงิน</button>
    </div>
</div>

<script>
    function openModal(name, price) {
        document.getElementById('photoName').innerText = name;
        document.getElementById('photoPrice').innerText = price;
        document.getElementById('orderModal').classList.remove('hidden');
    }
    function closeModal() {
        document.getElementById('orderModal').classList.add('hidden');
    }
</script>
